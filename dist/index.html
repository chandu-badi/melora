<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Melora — a little music, a better day."><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Melora · Your everyday soundtrack</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<aside class="sidebar"><a class="brand" href="#">◒ <span>melora</span></a><small>YOUR EVERYDAY SOUNDTRACK</small><nav><button data-page="home" class="active">⌂ <span>Discover</span></button><button data-page="search">⌕ <span>Search</span></button><button data-page="library">▤ <span>Your library</span></button><button data-page="liked">♡ <span>Liked songs</span></button></nav><div class="sidebar-label">YOUR PLAYLISTS <button id="newPlaylist" aria-label="Create playlist">+</button></div><div id="playlistNav"></div><div class="side-bottom"><span class="status-dot"></span> Your private listening space<button id="privacy">Privacy & app info ↗</button></div></aside>
<div class="workspace"><header><div class="breadcrumb">YOUR MUSIC. YOUR MOMENT.</div><div class="header-right"><span class="private-badge">◈ Private preview</span><button class="avatar" id="profile" aria-label="App information">C</button></div></header><main id="main"></main></div>
<aside class="queue-panel" id="queuePanel" hidden><div class="section-heading"><h2>Up next</h2><button id="closeQueue" aria-label="Close queue">×</button></div><p class="muted">Your listening queue</p><div id="queueList"></div></aside>
<footer class="player"><div class="now-playing"><div id="miniCover" class="cover mini c0">♪</div><div><strong id="trackTitle">Choose your soundtrack</strong><small id="trackArtist">Original instrumental demos</small></div><button id="playerLike" aria-label="Like current song">♡</button></div><div class="transport"><div class="controls"><button id="shuffle" aria-label="Shuffle" aria-pressed="false">⤨</button><button id="prev" aria-label="Previous song">◀</button><button class="play" id="play" aria-label="Play">▶</button><button id="next" aria-label="Next song">▶</button><button id="repeat" aria-label="Repeat" aria-pressed="false">↻</button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="32" value="0" step="0.1" aria-label="Playback position"><span id="duration">0:32</span></div></div><div class="player-extra"><button id="queueToggle" aria-label="Show queue">☷</button><span aria-hidden="true">◖</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div><audio id="audio" preload="metadata"></audio></footer>
<dialog id="modal"><form method="dialog"><button class="modal-close" aria-label="Close">×</button></form><div id="modalContent"></div></dialog><div id="toast" role="status"></div></body></html>
