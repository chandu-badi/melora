name: Validate and package Melora
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check dist/app.js
      - run: mkdir -p dist/assets && python generate_audio.py
      - name: Check generated audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import wave
          tracks = list(Path('dist/assets').glob('track-*.wav'))
          assert len(tracks) == 6
          for track in tracks:
              with wave.open(str(track)) as audio:
                  assert audio.getnframes() / audio.getframerate() == 32
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: melora-static-app
          path: dist/
          retention-days: 7
