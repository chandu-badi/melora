name: Validate and build Melora
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: mkdir -p public/assets && python generate_audio.py
      - run: node --check public/app.js
      - run: node tests/app.test.cjs
      - run: node tests/music-search.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: melora-app-build
          path: dist/
          retention-days: 7
